 }}

 for(let i=0;i<9;i++){

 }

 if(d.alt>-.075 && d.alt<.45){
   let q=clamp((state.time-6)/12),sx=W*(1.15-.92*q),sy=hy-H*.19*Math.sin(Math.PI*q);

function sceneDraw(){gl.useProgram(program);const d=dayParams();const pixelPerUnit=27;let asp=W/H,scale=pixelPerUnit;const cam=lookAt([0,8.2,20],[0,0,-1]);const vw=W/scale,vh=H/scale;const desired=H>W?.82:.76;let offset=(desired-.5)*vh;const proj=perspectiveOrtho(-vw/2,vw/2,-vh/2+offset,vh/2+offset,-100,150);gl.uniformMatrix4fv(loc.vp,false,new Float32Array(mul(proj,cam)));const theta=(state.time-6)/12*Math.PI;let along=Math.cos(theta);let sun=norm([along*1.20,Math.max(.018,d.alt)*1.80,along*.96]);const sampled=sampleSky(.73).map(v=>v/255);gl.uniform3fv(loc.sun,new Float32Array(sun));gl.uniform3fv(loc.ambient,new Float32Array(sampleSky(.4).map(v=>v/255)));gl.uniform3fv(loc.light,new Float32Array(mix([.96,.98,1.],sampled,d.warm*.85)));gl.uniform1f(loc.skyMix,state.skyMix);gl.uniform1f(loc.day,clamp(d.light*.82+.18));gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
