*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:#b8b5c8;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#30313a}#sky,#gl{position:fixed;inset:0;width:100%;height:100%;display:block}#gl{pointer-events:none}#menuButton{position:fixed;right:24px;bottom:calc(26px + env(safe-area-inset-bottom));width:38px;height:38px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;z-index:5;padding:4px}#menuButton i{display:block;width:24px;height:1.6px;background:#34343b;box-shadow:0 0 3px #fffc}#panel{position:fixed;bottom:calc(25px + env(safe-area-inset-bottom));left:18px;right:18px;max-width:440px;margin:auto;background:rgba(245,244,241,.96);padding:23px 22px 16px;border-radius:18px;box-shadow:0 12px 38px #272b3025;z-index:8;transition:opacity .2s,transform .2s;max-height:min(580px,80dvh);overflow:auto}#panel.hide{opacity:0;pointer-events:none;transform:translateY(10px)}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:21px}.head b{font-weight:500;font-size:13px;letter-spacing:.13em}.head button{border:0;background:none;font-size:24px;font-weight:200;color:#454853;line-height:1}h2{font-size:12px;letter-spacing:.09em;font-weight:550;margin:16px 0 9px}.sub{font-size:11px;line-height:1.6;color:#777984;margin:0 0 18px}.control{margin:15px 0}.between{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px}.between span:last-child{color:#777}input[type=range]{width:100%;accent-color:#4e5460;height:22px;margin:0;touch-action:none}select{width:100%;padding:9px 12px;border:1px solid #cbcdcd;background:#fff;border-radius:8px;color:#333;font-size:13px}.pill{font-size:11px;background:#deded9;padding:5px 9px;border-radius:20px}.notice{background:#e9e9e5;font-size:11px;line-height:1.65;border-radius:8px;padding:10px 12px;color:#62656e;margin-top:17px}#error{position:fixed;top:10px;left:10px;right:10px;background:#2d2d33;c </style></head><body><canvas id="sky"></canvas><canvas id="gl"></canvas><span id="hint">AMBIENCE / 2.0 TECHNICAL STUDY</span><button aria-label="設定を開く" id="menuButton"><i></i><i></i><i></i></button><section id="panel" class="hide"><div class="head"><b>LIGHT & WORLD</b><button aria-label="閉じる" id="close">×</button></div><p class="sub">景観と照明の技術検証です。現行の色彩編集・天候・Quick機能はこの版にはまだ移植していません。</p><div class="control"><div class="between"><label for="time">時刻</label><span id="timeValue">17:30</span></div><input id="time" type="range" min="0" max="24" step=".05" value="17.5"></div><div class="control"><div class="between"><label for="skyMix">天球からの色の影響</label><span id="skyMixValue">70%</span></div><input id="skyMix" type="range" min="0" max="100" step="1" value="70"></div><div class="control"><div class="between"><label for="cloud">雲量</label><span id="cloudValue">35%</span></div><input id="cloud" type="range" min="0" max="100" value="35"></div><div class="control"><h2>空の色彩プリセット（検証用）</h2><select id="preset"><option value="rose">薄紫・桃色の夕空</option><option value="blue">青空</option><option value="violet">紫・青緑の抽象空</option></select></div><div class="notice">確認ポイント：家・丘の受光方向／海の反射の移動／縦横回転で家・丘・焚き火場が伸縮しないこと。3D形状と雲は初期の仮モデルです。</div><button id="reset">時刻を12:00に戻す</button></section><div id="error"></div>
<script>
(()=>{'use strict';
const sky=document.getElementById('sky'),sc=sky.getContext('2d',{alpha:false}),canvas=document.getElementById('gl');
const gl=canvas.getContext('webgl',{alpha:true,antialias:true,premultipliedAlpha:false,powerPreference:'low-power'});
if(!gl){
 const warning=document.getElementById('error');warning.style.display='block';warning.textContent='この環境ではWebGLが使えないため、簡易2D表示です。3D照明の評価にはWebGL対応ブラウザが必要です。';
 let W=0,H=0;function fallback(){W=innerWidth;H=innerHeight;const dp=Math.min(devicePixelRatio||1,1.5);sky.width=W*dp;sky.height=H*dp;sc.setTransform(dp,0,0,dp,0,0);let g=sc.createLinearGradient(0,0,0,H);g.addColorStop(0,'#858eb7');g.addColorStop(.56,'#d4acc4');g.addColorStop(.74,'#e5b7ac');g.addColorStop(1,'#9eb7b0');sc.fillStyle=g;sc.fillRect(0,0,W,H);let hor=H*(H>W?.72:.35);sc.fillStyle='#859eaa';sc.fillRect(0,hor,W,H-hor);sc.fillStyle='#889a83';sc.beginPath();sc.moveTo(0,hor+H*.12);sc.quadraticCurveTo(W*.5,hor-H*.02,W,hor+H*.12);sc.lineTo(W,H);sc.lineTo(0,H);sc.fill();const sz=27,cx=W*.5,cy=H*(H>W?.83:.60);sc.save();sc.translate(cx,cy);sc.fillStyle='#d0c1ac';sc.fillRect(-32,-38,64,51);sc.fillStyle='#726678';sc.beginPath();sc.moveTo(-39,-37);sc.lineTo(0,-69);sc.lineTo(39,-37);sc.lineTo(31,-31);sc.lineTo(0,-56);sc.lineTo(-31,-31);sc.fill();sc.fillStyle='#4e4551';sc.fillRect(-5,-5,12,18);sc.fillStyle='#a48d7e';sc.fillRect(-28,-20,13,15);sc.fillRect(16,-20,13,15);sc.strokeStyle='#c4ad8e';sc.lineWidth=10;sc.beginPath();sc.moveTo(2,13);sc.quadraticCurveTo(-8,45,5,120);sc.stroke();sc.fillStyle='#77756e';sc.beginPath();sc.ellipse(110,10,21,10,0,0,Math.PI*2);sc.fill();sc.restore();}fallback();addEventListener('resize',fallback);const panel=document.getElementById('panel');document.getElementById('menuButton').onclick=()=>panel.classList.remove('hide');document.getElementById('close').onclick=()=>panel.classList.add('hide');return;
 }
let state={time:17.5,skyMix:.70,cloud:.35,preset:'rose'},W=390,H=844,dpr=1,tick=0,last=0;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));const lerp=(a,b,t)=>a+(b-a)*t;
const palettes={rose:[[87,91,150],[146,123,178],[226,155,167],[244,180,133]],blue:[[51,111,181],[107,165,217],[173,214,229],[229,228,213]],violet:[[54,66,118],[110,77,153],[210,103,159],[90,177,159]]};
const mix=(a,b,t)=>a.map((v,i)=>lerp(v,b[i],t));const css=(c,a=1)=>`rgba(${c.map(x=>Math.round(clamp(x,0,255))).join(',')},${a})`;
function dayParams(){const angle=(state.time-6)/12*Math.PI,alt=Math.sin(angle),light=clamp((alt+.15)/.48),warm=clamp(1-Math.abs(alt)/.85)*light,night=1-clamp((alt+.23)/.33);let x=Math.cos(angle)*.78;return {alt,light,warm,night,sunX:-x, sunY:clamp(.73-alt*.45,.13,.93)};}
function sampleSky(y){const p=palettes[state.preset];let s=clamp(y);let v=s<.37?mix(p[0],p[1],s/.37):s<.75?mix(p[1],p[2],(s-.37)/.38):mix(p[2],p[3],(s-.75)/.25);const d=dayParams();return mix(v,[9,14,35],d.night*.93);}
function hillHeight(x,z){return -.35+1.72*Math.exp(-x*x/230-(z+9)*(z+9)/125)+.10*Math.sin(x*.22+z*.16);}
function v3sub(a,b){return a.map((x,i)=>x-b[i]);}function cross(a,b){return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}function norm(v){let l=Math.hypot(...v)||1;return v.map(x=>x/l);}function dot(a,b){return a.reduce((s,v,i)=>s+v*b[i],0);}
function perspectiveOrtho(l,r,b,t,n,f){return [2/(r-l),0,0,0,0,2/(t-b),0,0,0,0,-2/(f-n),0,-(r+l)/(r-l),-(t+b)/(t-b),-(f+n)/(f-n),1];}
function lookAt(e,t){let z=norm(v3sub(e,t)),x=norm(cross([0,1,0],z)),y=cross(z,x);return [x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,e),-dot(y,e),-dot(z,e),1];}
function mul(a,b){let r=new Array(16).fill(0);for(let c=0;c<4;c++)for(let k=0;k<4;k++)for(let j=0;j<4;j++)r[c*4+j]+=a[k*4+j]*b[c*4+k];return r;}
const vert=`attribute vec3 aPosition;attribute vec3 aNormal;attribute vec3 aColor;uniform mat4 uVP;varying vec3 vNormal;varying vec3 vColor;varying vec3 vPos;void main(){vNormal=aNormal;vColor=aColor;vPos=aPosition;gl_Position=uVP*vec4(aPosition,1.);}`;
const frag=`precision mediump float;varying vec3 vNormal;varying vec3 vColor;varying vec3 vPos;uniform vec3 uSun;uniform vec3 uLightColor;uniform vec3 uAmbient;uniform float uSkyMix;uniform float uDay;void main(){vec3 n=normalize(vNormal);float nd=max(dot(n,uSun),0.);float shade=.40+nd*.88*uDay;vec3 light=mix(vec3(1.),uAmbient,uSkyMix*.80);vec3 col=vColor*light*shade;col+=vColor*uLightColor*nd*.43*uDay;col+=vColor*uAmbient*.11;gl_FragColor=vec4(pow(max(col,vec3(0.)),vec3(.88)),1.);}`;
function shader(type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
let program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vert));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,frag));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
let loc={pos:gl.getAttribLocation(program,'aPosition'),normal:gl.getAttribLocation(program,'aNormal'),color:gl.getAttribLocation(program,'aColor'),vp:gl.getUniformLocation(program,'uVP'),sun:gl.getUniformLocation(program,'uSun'),light:gl.getUniformLocation(program,'uLightColor'),ambient:gl.getUniformLocation(program,'uAmbient'),skyMix:gl.getUniformLocation(program,'uSkyMix'),day:gl.getUniformLocation(program,'uDay')};
const mesh={p:[],n:[],c:[]};function tri(a,b,c,color){let n=norm(cross(v3sub(b,a),v3sub(c,a)));for(let p of [a,b,c]){mesh.p.push(...p);mesh.n.push(...n);mesh.c.push(...color);}}function quad(a,b,c,d,color){tri(a,b,c,color);tri(a,c,d,color);}function box(x,y,z,w,h,depth,color){let X=x-w/2,A=x+w/2,Z=z-depth/2,B=z+depth/2,Y=y+h;quad([X,y,B],[A,y,B],[A,Y,B],[X,Y,B],color);quad([A,y,B],[A,y,Z],[A,Y,Z],[A,Y,B],color.map(v=>v*.89));quad([X,y,Z],[X,y,B],[X,Y,B],[X,Y,Z],color.map(v=>v*.92));quad([A,y,Z],[X,y,Z],[X,Y,Z],[A,Y,Z],color);quad([X,Y,B],[A,Y,B],[A,Y,Z],[X,Y,Z],color);}
// Fixed world coordinates: resizing must never modify geometry.
function generateWorld(){for(let iz=0;iz<55;iz++){let z0=-15+iz*.8,z1=z0+.8;for(let ix=0;ix<100;ix++){let x0=-45+ix*.9,x1=x0+.9;let p=[[x0,hillHeight(x0,z0),z0],[x1,hillHeight(x1,z0),z0],[x1,hillHeight(x1,z1),z1],[x0,hillHeight(x0,z1),z1]];const varr=Math.sin(x0*.18+z0*.23)*.014;quad(...p,[.45+varr,.56+varr,.43+varr]);}}
// cottage: center toward foreground, realistic geometric faces with two roof slopes
const x=0,z=0,y=hillHeight(x,z);box(0,y,0,2.45,1.65,2.2,[.83,.76,.68]);
// roof ridge parallel depth; roof planes have consistent world normals
const R=y+1.65,T=R+.90;quad([-1.53,R,1.34],[0,T,1.34],[0,T,-1.38],[-1.53,R,-1.38],[.34,.32,.37]);quad([0,T,1.34],[1.53,R,1.34],[1.53,R,-1.38],[0,T,-1.38],[.38,.35,.40]);
// triangular front pediment
tri([-1.23,R,1.11],[1.23,R,1.11],[0,T,1.11],[.81,.73,.68]);
// chimney on left slope
box(-.77,R+.25,-.55,.38,.84,.37,[.63,.56,.51]);
// front door & little windows slightly offset from wall
box(.12,y,1.115,.50,1.08,.028,[.37,.34,.37]);box(-.78,y+.82,1.125,.48,.47,.035,[.90,.75,.54]);
// side window
box(1.24,y+.75,-.17,.035,.48,.52,[.87,.73,.52]);
// path follows terrain from front of door towards camera
const segments=30;for(let j=0;j<segments;j++){const z0=1.12+j*.47,z1=z0+.47;let x0=.12+Math.sin(j*.105)*.21,x1=.12+Math.sin((j+1)*.105)*.21,w=.42+j*.019;quad([x0-w,hillHeight(x0,z0)+.028,z0],[x0+w,hillHeight(x0,z0)+.028,z0],[x1+w,hillHeight(x1,z1)+.028,z1],[x1-w,hillHeight(x1,z1)+.028,z1],[.67,.60,.51]);}
// fire pit fixed relative to cottage, not viewport
const fx=4.1,fz=1.35,fy=hillHeight(fx,fz);for(let i=0;i<15;i++){const a=i*Math.PI*2/15;let rx=fx+Math.cos(a)*.68,rz=fz+Math.sin(a)*.42;box(rx,hillHeight(rx,rz),rz,.24,.17,.20,[.53,.51,.48]);}box(fx,fy+.01,fz,.36,.07,.40,[.34,.31,.29]);
// single stones & grasses for scale
for(let i=0;i<19;i++){const x=2.9+(i*1.127%6.5),z=-.8+(i*2.9%9),y=hillHeight(x,z);if(i%5===0)box(x,y,z,.32,.10,.28,[.56,.57,.52]);}
}
generateWorld();let buffer=gl.createBuffer(), count=mesh.p.length/3;const data=new Float32Array(count*9);for(let i=0;i<count;i++){for(let c=0;c<3;c++){data[i*9+c]=mesh.p[i*3+c];data[i*9+c+3]=mesh.n[i*3+c];data[i*9+c+6]=mesh.c[i*3+c];}}gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,data,gl.STATIC_DRAW);for(let [key,ofs] of [['pos',0],['normal',3],['color',6]]){gl.enableVertexAttribArray(loc[key]);gl.vertexAttribPointer(loc[key],3,gl.FLOAT,false,36,ofs*4);}
gl.enable(gl.DEPTH_TEST);gl.disable(gl.CULL_FACE);gl.clearColor(0,0,0,0);
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,1.5);for(let c of [sky,canvas]){c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);}sc.setTransform(dpr,0,0,dpr,0,0);gl.viewport(0,0,canvas.width,canvas.height);}resize();addEventListener('resize',resize,{passive:true});
function skyDraw(t){const d=dayParams(),p=palettes[state.preset];let bg=sc.createLinearGradient(0,0,0,H);for(let j=0;j<=14;j++){let f=j/14,b=sampleSky(f);bg.addColorStop(f,css(b));}sc.fillStyle=bg;sc.fillRect(0,0,W,H);
// sea starts at a world-consistent approximate horizon; scene composited on top
let hy=H*(H>W? .715:.365);let sea=sc.createLinearGradient(0,hy,0,H);sea.addColorStop(0,css(mix(sampleSky(.68),[62,112,133],.40)));sea.addColorStop(1,css(mix(sampleSky(.61),[43,83,111],.65)));sc.fillStyle=sea;sc.fillRect(0,hy,W,H-hy);
// broad weak reflection at high altitude, tight column as sun reaches horizon
if(d.alt>-.12){let sx=W*(.5+d.sunX*.48),low=1-clamp(d.alt),width=lerp(W*.32,W*.045,low),g=sc.createRadialGradient(sx,hy+20,2,sx,hy+28,Math.max(30,width));let glint=css(mix(sampleSky(.83),[255,236,194],.58),clamp(.09+low*.42));g.addColorStop(0,glint);g.addColorStop(1,'rgba(255,228,180,0)');sc.fillStyle=g;sc.fillRect(sx-width*2,hy,W>width*4?width*4:W,H-hy);}
// stars, deterministic stable positions
if(d.night>.12){for(let i=0;i<125;i++){let x=((Math.sin(i*74.345)*5371)%1+1)%1,y=((Math.sin(i*28.87)*4171)%1+1)%1*.69;let a=clamp(d.night*(.25+.65*(.5+.5*Math.sin(t*.0005+i*4.9))));sc.fillStyle=`rgba(242,238,251,${a})`;sc.beginPath();sc.arc(x*W,y*H,(i%9===0?1.2:.55),0,Math.PI*2);sc.fill();}}
// subtle slow cloud bands only in prototype, silhouette shifts with time
for(let i=0;i<8;i++){let phase=(i*.329+t*.000002*(.5+i%3))%1,x=((phase*1.5-.25)*W),cy=H*(.17+(i%5)*.082),rw=W*(.14+(i%4)*.055),rh=H*(.028+i%3*.008);let cloud=sc.createRadialGradient(x,cy,0,x,cy,rw);let c=mix(sampleSky(cy/H),[222,214,220],.25);cloud.addColorStop(0,css(c,state.cloud*.39));cloud.addColorStop(.7,css(c,state.cloud*.18));cloud.addColorStop(1,css(c,0));sc.save();sc.translate(x,cy);sc.scale(1,rh/rw);sc.fillStyle=cloud;sc.beginPath();sc.arc(0,0,rw,0,Math.PI*2);sc.fill();sc.restore();}
if(d.alt>-.12){let sx=W*(.5+d.sunX*.48),sy=H*d.sunY,rr=H*.018;let halo=sc.createRadialGradient(sx,sy,0,sx,sy,rr*5);halo.addColorStop(0,'rgba(255,242,213,.55)');halo.addColorStop(.20,'rgba(255,234,208,.13)');halo.addColorStop(1,'rgba(255,234,208,0)');sc.fillStyle=halo;sc.fillRect(sx-rr*5,sy-rr*5,rr*10,rr*10);sc.fillStyle='rgba(255,244,222,.92)';sc.beginPath();sc.arc(sx,sy,rr,0,Math.PI*2);sc.fill();}
}
function sceneDraw(){const d=dayParams();const pixelPerUnit=27;let asp=W/H,scale=pixelPerUnit;const cam=lookAt([0,8.2,20],[0,0,-1]);const vw=W/scale,vh=H/scale;const desired=H>W?.80:.59;let offset=(desired-.5)*vh;const proj=perspectiveOrtho(-vw/2,vw/2,-vh/2+offset,vh/2+offset,-100,150);gl.uniformMatrix4fv(loc.vp,false,new Float32Array(mul(proj,cam)));const theta=(state.time-6)/12*Math.PI;let sun=norm([Math.cos(theta)*1.25,Math.max(.06,d.alt)*1.4,-.65]);const sampled=sampleSky(.73).map(v=>v/255);gl.uniform3fv(loc.sun,new Float32Array(sun));gl.uniform3fv(loc.ambient,new Float32Array(sampleSky(.4).map(v=>v/255)));gl.uniform3fv(loc.light,new Float32Array(mix([.96,.98,1.],sampled,d.warm*.85)));gl.uniform1f(loc.skyMix,state.skyMix);gl.uniform1f(loc.day,clamp(d.light*.82+.18));gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.drawArrays(gl.TRIANGLES,0,count);}
let stopped=false;function loop(t){if(!stopped){if(t-last>33){last=t;tick=t;skyDraw(t);sceneDraw();}requestAnimationFrame(loop)}}requestAnimationFrame(loop);document.addEventListener('visibilitychange',()=>{last=0;});
const panel=document.getElementById('panel');document.getElementById('menuButton').addEventListener('click',()=>panel.classList.remove('hide'));document.getElementById('close').addEventListener('click',()=>panel.classList.add('hide'));
for(let [id,field,format] of [['time','time',v=>`${String(Math.floor(v)).padStart(2,'0')}:${String(Math.round((v%1)*60)).padStart(2,'0')}`],['skyMix','skyMix',v=>`${v}%`],['cloud','cloud',v=>`${v}%`]]){let el=document.getElementById(id);el.addEventListener('input',()=>{let value=+el.value;state[field]=field==='time'?value:value/100;document.getElementById(id+'Value').textContent=format(value);});}document.getElementById('preset').addEventListener('change',e=>state.preset=e.target.value);document.getElementById('reset').addEventListener('click',()=>{state.time=12;document.getElementById('time').value=12;document.getElementById('timeValue').textContent='12:00';});
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();stopped=true;const n=document.getElementById('error');n.style.display='block';n.textContent='WebGLの描画コンテキストが失われました。ページを再読み込みしてください。';});
})();
</script></body></html>
