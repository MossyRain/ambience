),ys=p.map(z=>z[1]);draft.x=(Math.min(...xs)+Math.max(...xs))/2;draft.y=(Math.min(...ys)+Math.max(...ys))/2;draft.w=Math.max(...xs)-Math.min(...xs);draft.h=Math.max(...ys)-Math.min(...ys);draft.points=simplify(p)}else draft=null}if(draft&&draft.w>.007&&draft.h>.007){objects.push(draft);selected=draft.id;sync()}draft=null}drag=null;render()}edit.addEventListener('pointerup',end);edit.addEventListener('pointercancel',end);function simplify(p){let arr=p.filter((_,i)=>i%Math.max(1,Math.round(p.length/80))===0);if(arr.length<4)return p;let result=[];for(let i=0;i<arr.length;i++){let prev=arr[(i-1+arr.length)%arr.length],next=arr[(i+1)%arr.length],curr=arr[i];result.push([prev[0]*.15+curr[0]*.7+next[0]*.15,prev[1]*.15+curr[1]*.7+next[1]*.15])}return result}function bind(id,event,cb){$(id).addEventListener(event,cb)}bind('blur','input',e=>{blur=+e.target.value;$('blurVal').textContent=blur;render()});bind('shift','input',e=>{shift=+e.target.value/360;$('shiftVal').textContent=e.target.value+'°';render()});bind('color','input',e=>{const o=obj();if(o){o.color=e.target.value;sync();render()}});bind('size','input',e=>{const o=obj();if(o){o.scale=+e.target.value/100;$('sizeVal').textContent=e.target.value+'%';render()}});bind('rotation','input',e=>{const o=obj();if(o){o.rot=+e.target.value;$('rotationVal').textContent=e.target.value+'°';render()}});function duplicate(offset){const o=obj();if(!o)return;let n=structuredClone(o);n.id=nextId++;if(offset){n.x=wrap(n.x+.07,1);n.y=Math.min(1,n.y+.06)}objects.push(n);selected=n.id;sync();render()}bind('dup','click',()=>duplicate(false));bind('offset','click',()=>duplicate(true));bind('remove','click',()=>{objects=objects.filter(o=>o.id!==selected);selected=objects.at(-1)?.id||null;sync();render()});function moveOrder(d){let i=objects.findIndex(o=>o.id===selected),j=i+d;if(i<0||j<0||j>=objects.length)return;[objects[i],objects[j]]=[objects[j],objects[i]];sync();render()}bind('up','click',()=>moveOrder(1));bind('down','click',()=>moveOrder(-1));bind('reset','click',()=>preset(0));document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>preset(+b.dataset.preset));function download(name,url){let a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove()}bind('savepng','click',()=>download('sky-gradient.png',res.toDataURL('image/png')));bind('savedata','click',()=>{let blob=new Blob([JSON.stringify({version:1,objects,blur,shift,nextId},null,2)],{type:'application/json'});let url=URL.createObjectURL(blob);download('sky-gradient.json',url);setTimeout(()=>URL.revokeObjectURL(url),5000)});bind('loaddata','click',()=>$('fileinput').click());bind('fileinput','change',async e=>{const f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.objects))throw Error();objects=d.objects;nextId=d.nextId||Math.max(...objects.map(o=>o.id),0)+1;blur=d.blur??140;shift=d.shift??0;selected=objects.at(-1)?.id??null;$('blur').value=blur;$('blurVal').textContent=blur;$('shift').value=shift*360;$('shiftVal').textContent=Math.round(shift*360)+'°';sync();render()}catch{alert('設定ファイルを読み込めませんでした。')}e.target.value=''});
const tabs=[...document.querySelectorAll('[data-tab]')];
function showTab(tab){document.body.dataset.tab=tab;tabs.forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.setAttribute('aria-selected',String(b.dataset.tab===tab))});sync();setTimeout(()=>{renderEdit();if(tab==='gradient')fieldRender();if(tab==='scene')renderScene()},0)}
