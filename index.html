 const horizon=horizonScreenY(camera),worldX=x=>(x-W*.5)/PIXELS_PER_UNIT;
 const fromWorldX=x=>W*.5+x*PIXELS_PER_UNIT;
 // Gradient is anchored to horizon in world scale, NOT fitted to the screen height.
 // In overlapping portrait/landscape regions, the colour field is therefore identical.
 const colorAt=y=>sampleSky(clamp((y-horizon+790)/790,0,1));
 const stops=Math.max(2,Math.ceil(H/10));
 for(let k=0;k<stops;k++){
   const y0=H*k/stops,y1=H*(k+1)/stops+1;
   const grad=sc.createLinearGradient(0,y0,0,y1);
   grad.addColorStop(0,css(colorAt(y0)));
   grad.addColorStop(1,css(colorAt(y1)));
   sc.fillStyle=grad;sc.fillRect(0,y0,W,y1-y0);
 }
 // Distant sea drawn behind 3D terrain. Sea origin is a single world-space horizon.
 if(horizon<H){
   const yTop=Math.max(0,horizon);
   let sea=sc.createLinearGradient(0,horizon,0,horizon+460);
   sea.addColorStop(0,css(mix(colorAt(horizon+6),[92,131,155],.54)));
   sea.addColorStop(.42,css(mix(colorAt(horizon+20),[66,108,135],.59)));
   sea.addColorStop(1,css(mix(colorAt(horizon+65),[43,85,113],.64)));
   sc.fillStyle=sea;sc.fillRect(0,yTop,W,H-yTop);
   sc.save();sc.beginPath();sc.rect(0,yTop,W,H-yTop);sc.clip();
   // Fixed world-space wave fragments, cropped by viewport without stretching.
   for(let i=0;i<180;i++){
     const xWorld=(Math.sin(i*91.37)*1471.91)%1*30;
     const yWorld=((Math.sin(i*24.19)*8301.77)%1+1)%1;
     const xx=fromWorldX(xWorld),yy=horizon+3+Math.pow(yWorld,.7)*350;
     if(xx<-40||xx>W+40||yy<yTop||yy>H)continue;
     sc.strokeStyle=`rgba(232,225,219,${.032+.04*yWorld})`;
     sc.lineWidth=.55;sc.beginPath();sc.moveTo(xx,yy);sc.lineTo(xx+6+yWorld*10,yy);sc.stroke();
   }
   // Reflection center follows the sun in world coordinates. High sun = broad/faint.
   if(d.alt>-.075 && d.light>.05){
     const angle=(state.time-6)/12*Math.PI;
     const sunWorldX=16-21*clamp((state.time-6)/12);
     const sunX=fromWorldX(sunWorldX);
     const altitude=clamp(d.alt),strength=Math.pow(1-altitude,1.8)*.38+.018;
     const width=PIXELS_PER_UNIT*(.9+5.8*altitude),span=260;
     sc.save();sc.globalCompositeOperation='screen';
     const gg=sc.createRadialGradient(sunX,horizon+12,2,sunX,horizon+75,Math.max(25,width));
     gg.addColorStop(0,`rgba(255,223,186,${strength})`);
     gg.addColorStop(.5,`rgba(255,225,203,${strength*.27})`);
     gg.addColorStop(1,'rgba(255,220,190,0)');
     sc.fillStyle=gg;sc.fillRect(sunX-width*2,horizon,width*4,span);
     if(altitude<.32){
       for(let i=0;i<45;i++){
         let v=((Math.sin(i*19.9)*177.31)%1+1)%1;
         let yy=horizon+4+i*5.3,xx=sunX+Math.sin(i*8.9)*width*(.22+yy/800);
         sc.strokeStyle=`rgba(255,228,190,${strength*(.24+.37*v)})`;
         sc.lineWidth=.6+v;sc.beginPath();sc.moveTo(xx-width*(.06+.1*v),yy);sc.lineTo(xx+width*(.06+.1*v),yy);sc.stroke();
       }
     }
     sc.restore();
   }
   sc.restore();
 }
 // All sky features exist in fixed coordinates relative to one world horizon.
 sc.save();sc.beginPath();sc.rect(0,0,W,Math.max(0,horizon));sc.clip();
 if(d.night>.12){for(let i=0;i<150;i++){
   const wx=(Math.sin(i*74.345)*5371)%65,above=80+(((Math.sin(i*28.87)*4171)%1+1)%1)*720;
   const x=fromWorldX(wx),y=horizon-above;
   const alpha=clamp(d.night*(.24+.65*(.5+.5*Math.sin(t*.0005+i*4.9))));
   sc.fillStyle=`rgba(242,238,251,${alpha})`;
   sc.beginPath();sc.arc(x,y,i%9===0?1.2:.55,0,Math.PI*2);sc.fill();
 }}
 // Deterministic cloud field; fixed world locations/sizes and steady drift.
 // Turning a device changes only which portion of the SAME field is visible.
 const elapsed=t*.000014;
 for(let i=0;i<28;i++){
   const seed=(Math.sin(i*89.1+4.55)*7301)%1;
   const rxSeed=(Math.sin(i*47.31+11.33)*6311)%1;
   const worldXPos=-43+i*3.35+seed*1.7;
   const wx=worldXPos+elapsed*(.35+i%3*.09);
   const above=35+((i*83.17+i*i*13.49)%600);
   const depth=(i%4)/3;
   const size=28+depth*39+Math.abs(rxSeed)*25;
   const cx=fromWorldX(wx),cy=horizon-above;
   const rw=size,rh=size*(.19+.07*((i*17)%5)/4);
   if(cx+rw<-5||cx-rw>W+5||cy+rh<0||cy-rh>horizon)continue;
   const tone=mix(colorAt(cy),[233,222,231],.27),alpha=state.cloud*(.27+.12*depth);
   sc.save();sc.translate(cx,cy);sc.scale(1,rh/rw);
   const g=sc.createRadialGradient(0,0,rw*.04,0,0,rw);
   g.addColorStop(0,css(tone,alpha));g.addColorStop(.62,css(tone,alpha*.7));g.addColorStop(1,css(tone,0));
   sc.fillStyle=g;sc.beginPath();sc.arc(0,0,rw,0,Math.PI*2);sc.fill();sc.restore();
 }
 // Sun's location is world-relative, not a percentage of viewport width.
 if(d.alt>-.075&&d.alt<.45){
   let q=clamp((state.time-6)/12),wx=16-21*q;
   let sx=fromWorldX(wx),sy=horizon-d.alt*195;
   if(q>.45||sx<W-10){
     let rr=PIXELS_PER_UNIT*.32;
     let halo=sc.createRadialGradient(sx,sy,0,sx,sy,rr*4);
     halo.addColorStop(0,'rgba(255,241,214,.47)');halo.addColorStop(.2,'rgba(255,229,196,.13)');halo.addColorStop(1,'rgba(255,231,197,0)');
     sc.fillStyle=halo;sc.fillRect(sx-rr*4,sy-rr*4,rr*8,rr*8);
     sc.fillStyle='rgba(255,242,218,.95)';sc.beginPath();sc.arc(sx,sy,rr,0,Math.PI*2);sc.fill();
   }
 }
 sc.restore();
}
function sceneDraw(){gl.useProgram(program);const d=dayParams();const camera=getCamera();const cam=camera.view;const proj=camera.proj;gl.uniformMatrix4fv(loc.vp,false,new Float32Array(mul(proj,cam)));const theta=(state.time-6)/12*Math.PI;let along=Math.cos(theta);let sun=norm([along*1.20,Math.max(.018,d.alt)*1.80,along*.96]);const sampled=sampleSky(.73).map(v=>v/255);gl.uniform3fv(loc.sun,new Float32Array(sun));gl.uniform3fv(loc.ambient,new Float32Array(sampleSky(.4).map(v=>v/255)));gl.uniform3fv(loc.light,new Float32Array(mix([.96,.98,1.],sampled,d.warm*.85)));gl.uniform1f(loc.skyMix,state.skyMix);gl.uniform1f(loc.day,clamp(d.light*.82+.18));gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
 gl.useProgram(program);gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
 for(let [key,ofs] of [['pos',0],['normal',3],['color',6]]){gl.enableVertexAttribArray(loc[key]);gl.vertexAttribPointer(loc[key],3,gl.FLOAT,false,36,ofs*4);}
 gl.drawArrays(gl.TRIANGLES,0,count);
 drawShadow(sun,mul(proj,cam),d.light);
}
let stopped=false;function loop(t){if(!stopped){if(t-last>33){last=t;tick=t;skyDraw(t);sceneDraw();}requestAnimationFrame(loop)}}requestAnimationFrame(loop);document.addEventListener('visibilitychange',()=>{last=0;});
const panel=document.getElementById('panel');const openButton=document.getElementById('menuButton');
let menuOpen=false;
function setMenu(open){menuOpen=open;panel.classList.toggle('hide',!open);openButton.setAttribute('aria-expanded',String(open));}
openButton.addEventListener('click',()=>setMenu(true));
document.getElementById('close').addEventListener('click',()=>setMenu(false));
// Resizing must not recreate the panel or reset its state.
addEventListener('orientationchange',()=>requestAnimationFrame(()=>setMenu(menuOpen)),{passive:true});

for(let [id,field,format] of [['time','time',v=>`${String(Math.floor(v)).padStart(2,'0')}:${String(Math.round((v%1)*60)).padStart(2,'0')}`],['skyMix','skyMix',v=>`${v}%`],['cloud','cloud',v=>`${v}%`]]){let el=document.getElementById(id);el.addEventListener('input',()=>{let value=+el.value;state[field]=field==='time'?value:value/100;document.getElementById(id+'Value').textContent=format(value);});}document.getElementById('preset').addEventListener('change',e=>state.preset=e.target.value);document.getElementById('reset').addEventListener('click',()=>{state.time=12;document.getElementById('time').value=12;document.getElementById('timeValue').textContent='12:00';});
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();stopped=true;const n=document.getElementById('error');n.style.display='block';n.textContent='WebGLの描画コンテキストが失われました。ページを再読み込みしてください。';});
})();
