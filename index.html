// Coverage is an *area mask*, not a full-screen white fog. At high coverage a

let cloudBankCanvas=document.createElement('canvas'),cloudBankCtx=cloudBankCanvas.getContext('2d');

function cloudValueNoise(x,y){

function cloudBank(t,horizon,coverage,thickness,d,colorAt){

 const w=Math.max(2,Math.ceil(W/6)),h=Math.max(2,Math.ceil(Math.min(H,horizon)/6));
 const key=[w,h,Math.round(horizon),Math.round(coverage*100),Math.round(thickness*100),state.preset,Math.round(d.night*25),Math.round(t/240)].join('/');
 if(key!==cloudBankKey){
   cloudBankKey=key;cloudBankCanvas.width=w;cloudBankCanvas.height=h;
   const image=cloudBankCtx.createImageData(w,h),pixels=image.data;
   const threshold=1.02-1.22*clamp((coverage-.62)/.38);
   const overcastBlend=clamp((coverage-.62)/.25);
   const drift=t*.000002;
   for(let y=0;y<h;y++){
     const screenY=y*6;const toneSource=colorAt(screenY);
     let base=mix(toneSource,[189,191,199],.47+.19*thickness);
     base=mix(base,[36,40,57],d.night*.80);
     for(let x=0;x<w;x++){
       // Anchored in a shared world coordinate system, independent of screen dimensions.
       const wx=(x*6-W*.5)*.010+drift,wy=(horizon-screenY)*.010;

function drawCloudField(t,horizon,fromWorldX,colorAt,d){

   const xWorld=-76+cloudHash(seed*17+5)*152;

   const y=horizon-rise;

   // At night clouds have very weak illumination, even if a bright sky palette is selected.
   tone=mix(tone,[40,43,59],d.night*.80);

}

function skyDraw(t){

   const y0=H*k/stops,y1=H*(k+1)/stops+1;

   const yTop=Math.max(0,horizon);

   const seaMid=mix(mix(colorAt(horizon+20),[66,108,135],.59),[7,14,24],seaNight*.86);

       // No drawn wave streaks or line segments: the sea is softly coloured by sky and sun.

    const reflected=skySunPosition(d.sun,horizon);
    if(d.alt>0 && reflected.visible && reflected.x>-330 && reflected.x<W+330){
      const intensity=clamp(d.light)*(.35+.28*(1-clamp(d.alt/.65)));
      const spread=45+65*clamp(d.alt/.75);

    }

 }
 // All sky features exist in fixed coordinates relative to one world horizon.
 sc.save();sc.beginPath();sc.rect(0,0,W,Math.max(0,horizon));sc.clip();
 if(d.night>.12){for(let i=0;i<150;i++){
   const wx=(Math.sin(i*74.345)*5371)%65,above=80+(((Math.sin(i*28.87)*4171)%1+1)%1)*720;
   const x=fromWorldX(wx),y=horizon-above;
   const alpha=clamp(d.night*(.24+.65*(.5+.5*Math.sin(t*.0005+i*4.9))));
   sc.fillStyle=`rgba(242,238,251,${alpha})`;
   sc.beginPath();sc.arc(x,y,i%9===0?1.2:.55,0,Math.PI*2);sc.fill();
 }}
 // Clouds: count/coverage is independent of opacity, which is controlled by thickness.

 drawCloudField(t, horizon, fromWorldX, colorAt, d);
   // The disc follows the equinox solar vector; it is never time-switched.
  const disc=skySunPosition(d.sun,horizon);
  if(disc.visible && d.alt>-.025){
    const sx=disc.x,sy=disc.y,rr=PIXELS_PER_UNIT*.32;
    if(sx>-rr*5&&sx<W+rr*5&&sy>-rr*5&&sy<horizon+rr*2){
      const halo=sc.createRadialGradient(sx,sy,0,sx,sy,rr*3.6);
      halo.addColorStop(0,'rgba(255,241,214,.30)');
      halo.addColorStop(.22,'rgba(255,229,196,.09)');
      halo.addColorStop(1,'rgba(255,231,197,0)');
      sc.fillStyle=halo;sc.fillRect(sx-rr*3.6,sy-rr*3.6,rr*7.2,rr*7.2);

function sceneDraw(){

 gl.useProgram(program);

 for(let [key,ofs] of [['pos',0],['normal',3],['color',6]]){
